services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: effect_login
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d effect_login"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - effect-login-db:/var/lib/postgresql/data

volumes:
  effect-login-db:
